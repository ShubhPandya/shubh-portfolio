<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1 id="name">Loading...</h1>
      <div id="title" class="subtitle"></div>
      <p id="bio" class="bio"></p>
      <div id="social-links" class="links"></div>
      
      <!-- Serverless Visitor Counter -->
      <div class="visitor-counter">
        <span>👀 Live Views: </span><span id="view-count">Loading...</span>
      </div>
    </header>

    <section>
      <h2>Certifications</h2>
      <div id="certifications-list" class="grid"></div>
    </section>

    <section>
      <h2>Technical Skills</h2>
      <div id="skills-list" class="tags"></div>
    </section>

    <section>
      <h2>Cloud & Engineering Projects</h2>
      <div id="projects-list" class="grid"></div>
    </section>
  </div>

  <script>
    // 1. Fetch Profile and Portfolio Data
    fetch('./data.json')
      .then(response => response.json())
      .then(data => {
        // Render Profile Header
        document.getElementById('name').textContent = data.profile.name;
        document.getElementById('title').textContent = data.profile.title;
        document.getElementById('bio').textContent = data.profile.bio;
        
        const linksContainer = document.getElementById('social-links');
        linksContainer.innerHTML = `
          <a href="${data.profile.github}" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="${data.profile.linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=${data.profile.email}" target="_blank" rel="noopener noreferrer">Email</a>
        `;

        // Render Certifications (with badge link support)
        const certContainer = document.getElementById('certifications-list');
        certContainer.innerHTML = data.certifications.map(cert => `
          <div class="card">
            <h3>${cert.name} <span class="status-badge">${cert.status}</span></h3>
            <p>${cert.issuer} • ${cert.date}</p>
            ${cert.badge_link ? `
              <div class="card-links" style="margin-top: 8px;">
                <a href="${cert.badge_link}" target="_blank" rel="noopener noreferrer">Verify Credly Badge ↗</a>
              </div>
            ` : ''}
          </div>
        `).join('');

        // Render Skills
        const skillsContainer = document.getElementById('skills-list');
        skillsContainer.innerHTML = data.skills.map(skill => `
          <span class="tag">${skill}</span>
        `).join('');

        // Render Projects
        const projContainer = document.getElementById('projects-list');
        projContainer.innerHTML = data.projects.map(proj => `
          <div class="card">
            <h3>${proj.title}</h3>
            <p>${proj.description}</p>
            <div class="tags">
              ${proj.techStack.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <div class="card-links" style="margin-top: 12px;">
              <a href="${proj.githubLink}" target="_blank" rel="noopener noreferrer">GitHub Repo →</a>
            </div>
          </div>
        `).join('');
      })
      .catch(err => console.error("Error loading portfolio data:", err));

    // 2. Fetch Live Visitor Count via API Gateway
    fetch('https://fa2mm1z6id.execute-api.ap-south-1.amazonaws.com/views')
      .then(response => response.json())
      .then(data => {
        document.getElementById('view-count').textContent = data.views;
      })
      .catch(err => {
        console.error('Error fetching live views:', err);
        document.getElementById('view-count').textContent = '—';
      });
  </script>
</body>
</html>
